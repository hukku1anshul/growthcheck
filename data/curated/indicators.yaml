# Indicator catalogue.
# Every series the app can plot is declared here, together with the plain-language
# explainer that MUST be shown to the user. A series with no explainer does not ship.
#
# fields:
#   source       worldbank | owid
#   code         the source's own series id (WB indicator code, or OWID grapher slug)
#   column       for owid sources, the value column in the grapher CSV
#   direction    up_good | down_good | neutral   (drives colour, never a score)
#   plain        one sentence, no jargon
#   measures     what the number literally counts
#   blindspots   what it does NOT capture - shown with equal weight to `plain`
#   gamed        how governments flatter this number. omit only if genuinely not gameable.

categories:
  economy:
    label: Economy
    blurb: Size, growth and stability of what the country produces.
  livelihood:
    label: Livelihoods
    blurb: What the economy delivers to an ordinary household.
  state:
    label: The state's finances
    blurb: What the government takes in, spends and owes.
  openness:
    label: Openness
    blurb: How connected the economy is to the rest of the world.
  human:
    label: Human development
    blurb: Health, education and survival - the slowest-moving, hardest-to-fake numbers.
  security:
    label: Conflict & defence
    blurb: >-
      War, armed violence and the means of it. Counted where the fighting
      happened, which is not the same as who caused it.
  politics:
    label: Politics & rights
    blurb: How power is won, constrained and abused. Expert-coded, not government-reported.

indicators:

  # ---------------- economy ----------------
  - id: gdp_pc
    category: economy
    source: worldbank
    code: NY.GDP.PCAP.KD
    name: GDP per capita
    unit: constant 2015 US$
    direction: up_good
    plain: >-
      The country's total output divided by its population, with inflation stripped
      out so different years compare fairly.
    measures: Market value of goods and services produced per person per year.
    blindspots: >-
      An average, so it says nothing about distribution - it rises even if all the
      gains go to the top 1%. Excludes unpaid work, most of the informal economy, and
      treats environmental destruction as income.
    gamed: >-
      Rebasing the national accounts to a new base year can lift the level overnight
      without anything real changing. India's 2015 revision and Nigeria's 2014
      rebasing are the textbook cases.

  - id: gdp_growth
    category: economy
    source: worldbank
    code: NY.GDP.MKTP.KD.ZG
    name: GDP growth
    unit: "% per year"
    direction: up_good
    plain: How much bigger the economy got compared with last year.
    measures: Year-on-year percentage change in inflation-adjusted total output.
    blindspots: >-
      Very noisy year to year. A high growth rate from a low base is not the same as a
      high growth rate from a high base - always read it next to the level, not alone.
    gamed: >-
      Base-year effects: a terrible year makes the next year's growth look
      spectacular with no real recovery.

  - id: inflation
    category: economy
    source: worldbank
    code: FP.CPI.TOTL.ZG
    name: Inflation (consumer prices)
    unit: "% per year"
    direction: neutral
    plain: How much faster prices rose this year than last.
    measures: Annual change in the cost of a fixed basket of consumer goods.
    blindspots: >-
      The basket is a national average and rarely matches what a poor household
      actually buys - food and fuel weigh far more in a poor budget. Mild inflation is
      normal; the target in most countries is around 2%, not zero.
    gamed: >-
      Basket composition and weights are set by the statistical agency. Changing them,
      or substituting cheaper goods when prices rise, quietly lowers the printed
      number. Argentina's 2007-2015 statistics are the notorious case.

  - id: unemployment
    category: economy
    source: worldbank
    code: SL.UEM.TOTL.ZS
    name: Unemployment rate
    unit: "% of labour force"
    direction: down_good
    plain: >-
      The share of people who want a job and are actively looking, but do not have one.
    measures: >-
      Unemployed as a percentage of the labour force, on ILO-modelled estimates.
    blindspots: >-
      Excludes anyone who gave up looking, and counts one hour of paid work a week as
      employed. In economies with large informal sectors this number is close to
      meaningless on its own - read it next to labour-force participation.
    gamed: >-
      Moving people onto disability or training schemes removes them from the labour
      force and lowers the rate without creating a single job.

  # ---------------- livelihood ----------------
  - id: gini
    category: livelihood
    source: worldbank
    code: SI.POV.GINI
    name: Income inequality (Gini)
    unit: 0 = perfect equality, 100 = one person has everything
    direction: down_good
    plain: A single number for how unevenly income is shared.
    measures: Statistical dispersion of income across households, from survey data.
    blindspots: >-
      Patchy - most countries report it only every few years, so the line will have
      gaps. Household surveys systematically miss the very rich, so real inequality is
      almost always worse than the printed figure.

  - id: labour_participation
    category: livelihood
    source: worldbank
    code: SL.TLF.CACT.ZS
    name: Labour force participation
    unit: "% of population 15+"
    direction: neutral
    plain: >-
      The share of working-age people who are either working or looking for work.
    measures: >-
      Economically active population as a share of those aged 15 and over.
    blindspots: >-
      A fall can mean mass discouragement (bad) or mass enrolment in education (good).
      It cannot tell you which - check the age breakdown before concluding anything.

  - id: poverty
    category: livelihood
    source: worldbank
    code: SI.POV.DDAY
    name: Extreme poverty
    unit: "% below $2.15/day (2017 PPP)"
    direction: down_good
    plain: >-
      The share of people living on less than the international extreme-poverty line.
    measures: >-
      Headcount below $2.15 a day, adjusted for what money actually buys locally.
    blindspots: >-
      An extremely low bar - someone just above it is still desperately poor.
      Survey-based and infrequent, so expect gaps and sudden jumps when a new survey
      lands.

  # ---------------- the state ----------------
  - id: govt_debt
    category: state
    source: worldbank
    code: GC.DOD.TOTL.GD.ZS
    name: Central government debt
    unit: "% of GDP"
    direction: neutral
    plain: >-
      What the central government owes, measured against the size of the economy.
    measures: Gross central government debt stock as a share of GDP.
    blindspots: >-
      Not automatically bad - it depends on the interest rate, the currency it's owed
      in, and who holds it. Debt in your own currency is a different animal from debt
      in dollars. Excludes state/provincial debt and public-sector guarantees, which
      can be enormous.
    gamed: >-
      Moving borrowing off-budget into state-owned enterprises keeps it out of this
      number entirely.

  - id: tax_revenue
    category: state
    source: worldbank
    code: GC.TAX.TOTL.GD.ZS
    name: Tax revenue
    unit: "% of GDP"
    direction: neutral
    plain: >-
      How much the government collects in tax, measured against the size of the
      economy.
    measures: >-
      Compulsory transfers to central government, excluding fines and most social
      security.
    blindspots: >-
      Says nothing about who pays. A country can raise this number entirely through
      sales taxes that fall hardest on the poor. Low figures usually signal a large
      informal economy rather than generosity.

  - id: health_spend
    category: state
    source: worldbank
    code: SH.XPD.CHEX.GD.ZS
    name: Health spending (total)
    unit: "% of GDP"
    direction: up_good
    plain: >-
      Everything spent on health care - government and private together - against the
      size of the economy.
    measures: Current health expenditure as a share of GDP.
    blindspots: >-
      Includes out-of-pocket spending, so a high number can mean a failing public
      system that forces households to pay privately. The US is the extreme example.
      Always read alongside life expectancy before judging.

  - id: edu_spend
    category: state
    source: worldbank
    code: SE.XPD.TOTL.GD.ZS
    name: Government education spending
    unit: "% of GDP"
    direction: up_good
    plain: What the government spends on education, against the size of the economy.
    measures: General government expenditure on education, all levels.
    blindspots: >-
      Money in, not learning out. Large shares can go to salaries in systems where
      teacher absenteeism is high. Pair with literacy before drawing conclusions.

  # ---------------- openness ----------------
  - id: trade_openness
    category: openness
    source: worldbank
    code: NE.TRD.GNFS.ZS
    name: Trade openness
    unit: "% of GDP (exports + imports)"
    direction: neutral
    plain: >-
      How large the country's trade with the world is, relative to its own economy.
    measures: Exports plus imports of goods and services, divided by GDP.
    blindspots: >-
      Small countries score structurally high and big countries structurally low - the
      US and India will always look closed next to Singapore. Compare a country with
      its own past, not with a country of a different size.

  - id: fdi
    category: openness
    source: worldbank
    code: BX.KLT.DINV.WD.GD.ZS
    name: Foreign direct investment, net inflows
    unit: "% of GDP"
    direction: neutral
    plain: >-
      Money coming in from abroad to buy or build lasting business interests.
    measures: >-
      Net inflows of investment acquiring a lasting stake in a foreign enterprise.
    blindspots: >-
      Heavily distorted by round-tripping - domestic money routed through a tax haven
      and back to claim foreign-investor benefits. Mauritius-to-India and
      Cyprus-to-Russia flows are mostly this.

  # ---------------- human development ----------------
  - id: life_expectancy
    category: human
    source: worldbank
    code: SP.DYN.LE00.IN
    name: Life expectancy at birth
    unit: years
    direction: up_good
    plain: >-
      How long a baby born this year would live if today's death rates held for its
      whole life.
    measures: Period life expectancy at birth, both sexes.
    blindspots: >-
      A projection under frozen conditions, not a prediction. Historically dragged
      down hard by infant deaths, so big early gains often reflect fewer babies dying
      rather than old people living longer.

  - id: infant_mortality
    category: human
    source: worldbank
    code: SP.DYN.IMRT.IN
    name: Infant mortality
    unit: deaths per 1,000 live births
    direction: down_good
    plain: >-
      How many babies out of every thousand die before their first birthday.
    measures: Deaths of infants under one year per 1,000 live births.
    blindspots: >-
      One of the hardest numbers to fake and one of the best single summaries of
      whether a state actually functions. Weak civil registration means poor countries
      under-count both deaths and births.

  - id: literacy
    category: human
    source: worldbank
    code: SE.ADT.LITR.ZS
    name: Adult literacy
    unit: "% of people 15+"
    direction: up_good
    plain: >-
      The share of adults who can read and write a short simple statement.
    measures: Literate population aged 15 and over, as a percentage.
    blindspots: >-
      A very low bar that says nothing about comprehension, and often self-reported by
      the household rather than tested. Reported infrequently, so expect a sparse line.

  - id: urbanisation
    category: human
    source: worldbank
    code: SP.URB.TOTL.IN.ZS
    name: Urban population
    unit: "% of total"
    direction: neutral
    plain: The share of people living in towns and cities.
    measures: Urban residents as a percentage of total population.
    blindspots: >-
      Each country defines 'urban' itself, so cross-country comparison is genuinely
      unreliable. Reclassifying villages as towns moves this number without anyone
      relocating.

  - id: population
    category: human
    source: worldbank
    code: SP.POP.TOTL
    name: Population
    unit: people
    direction: neutral
    plain: How many people live in the country.
    measures: Total resident population, all ages.
    blindspots: >-
      Between censuses this is an estimate. Countries that have skipped a census for
      years are carrying forward assumptions, not counts.

  # ---------------- long run ----------------
  - id: gdp_pc_maddison
    category: economy
    source: owid
    code: gdp-per-capita-maddison
    column: GDP per capita
    name: GDP per capita (long run, Maddison)
    unit: int-$ (2011 prices)
    direction: up_good
    plain: >-
      The same idea as GDP per capita, but reconstructed by economic historians so it
      reaches back a century or more.
    measures: >-
      Historical real GDP per capita estimates from the Maddison Project Database.
    blindspots: >-
      Before roughly 1950 these are scholarly reconstructions, not measurements - the
      error bars are wide and they get wider the further back you go. Use it for the
      shape of the trend, never for a precise figure.

  # ---------------- politics (expert-coded, not government-reported) ----------------
  - id: vdem_electoral
    category: politics
    source: owid
    code: electoral-democracy-index
    column: Electoral democracy index
    name: Electoral democracy index (V-Dem)
    unit: 0 to 1
    direction: up_good
    plain: >-
      How free and fair elections actually are, and how much freedom of speech and
      association surrounds them.
    measures: >-
      V-Dem's polyarchy index, aggregated from expert ratings on suffrage, clean
      elections, elected officials holding real power, and freedom of expression and
      association.
    blindspots: >-
      Built from the judgements of country experts, not from a mechanical count.
      V-Dem publishes uncertainty intervals for exactly this reason. Small
      year-to-year wiggles are noise; sustained multi-year moves are the signal.
    gamed: >-
      Hard to game directly, which is precisely why it's here - it does not depend on
      the government reporting on itself.

  - id: vdem_liberal
    category: politics
    source: owid
    code: liberal-democracy-index
    column: Liberal democracy index
    name: Liberal democracy index (V-Dem)
    unit: 0 to 1
    direction: up_good
    plain: >-
      Not just whether elections happen, but whether courts, law and minority rights
      constrain whoever wins.
    measures: >-
      Electoral democracy plus judicial and legislative constraints on the executive
      and protection of individual liberties.
    blindspots: >-
      A country can hold genuinely competitive elections and still score poorly here
      if the winner faces no real checks. The gap between this and the electoral index
      is often the most interesting thing on the chart.

  - id: vdem_corruption
    category: politics
    source: owid
    code: political-corruption-index
    column: Political Corruption Index
    name: Political corruption index (V-Dem)
    unit: 0 = least corrupt, 1 = most
    direction: down_good
    plain: >-
      How much public officials - in the executive, legislature, courts and
      bureaucracy - use their position for private gain.
    measures: >-
      V-Dem composite across executive, legislative, judicial and public-sector
      corruption.
    blindspots: >-
      Measures perception and expert assessment, not convictions. Convictions measure
      prosecutorial capacity as much as corruption, which is why this is the more
      honest of the two.

  - id: political_regime
    category: politics
    source: owid
    code: political-regime
    column: Political regime
    name: Political regime type
    unit: 0 closed autocracy, 1 electoral autocracy, 2 electoral democracy, 3 liberal democracy
    direction: up_good
    plain: >-
      A four-way classification of what kind of political system the country had that
      year.
    measures: >-
      Regimes of the World classification, derived from V-Dem indicators.
    blindspots: >-
      A step function - it hides gradual erosion until the year a country crosses a
      threshold. Use the continuous V-Dem indices to see change coming; use this to
      label it.

  # ---------------- added: broader coverage of the same questions -----------
  # Every entry below was probed against the World Bank API before being added -
  # code, name, unit, observation count and year span all read off the live
  # response rather than copied from documentation. EN.ATM.CO2E.PC, the code
  # most tutorials still give for CO2 per capita, is retired and returns
  # "Invalid format"; the AR5 code below is its live replacement.

  - id: gdp_total
    category: economy
    source: worldbank
    code: NY.GDP.MKTP.KD
    name: GDP, total
    unit: constant 2015 US$
    direction: up_good
    plain: The whole economy's output, inflation stripped out, not divided by population.
    measures: Market value of all goods and services produced in a year.
    blindspots: >-
      Size is not prosperity. A large, poor country outranks a small, rich one on
      this number and always will, which is why it belongs beside GDP per capita
      rather than instead of it.
    gamed: >-
      The same rebasing trick as GDP per capita, with more room to hide: revisions
      to the deflator move the level without any change in what was produced.

  - id: gdp_pc_growth
    category: economy
    source: worldbank
    code: NY.GDP.PCAP.KD.ZG
    name: GDP per capita growth
    unit: "% per year"
    direction: up_good
    plain: How much richer the average person got, after accounting for more people.
    measures: Annual change in inflation-adjusted output per person.
    blindspots: >-
      An average again. It can be positive while most people get poorer, if the
      gains are concentrated. Where population is falling it flatters the number
      for reasons nobody chose.
    gamed: >-
      An undercounted population raises output per head arithmetically, so a
      delayed or disputed census lifts this without anything being produced.

  - id: manufacturing
    category: economy
    source: worldbank
    code: NV.IND.MANF.ZS
    name: Manufacturing share of output
    unit: "% of GDP"
    direction: neutral
    plain: How much of the economy is making physical things.
    measures: Value added by manufacturing as a share of total output.
    blindspots: >-
      A falling share is not automatically decline - rich countries shift towards
      services as they get richer. It is bad news only when it falls WITHOUT that
      shift, which this number alone cannot tell you.
    gamed: >-
      Reclassifying assembly or processing work between industry and services
      moves the share without moving a single factory.

  - id: investment
    category: economy
    source: worldbank
    code: NE.GDI.TOTL.ZS
    name: Investment (capital formation)
    unit: "% of GDP"
    direction: up_good
    plain: How much of what the country earns is put back into building things.
    measures: >-
      Gross capital formation - buildings, machinery, infrastructure and inventory
      changes - as a share of output.
    blindspots: >-
      Counts spending, never usefulness. A bridge to nowhere and a needed railway
      are the same number here, and a construction boom that ends in empty towers
      looks identical to productive investment while it lasts.
    gamed: >-
      Bringing projects forward before an election raises it for a year or two.
      Unsold inventory also counts as investment.

  - id: youth_unemployment
    category: livelihood
    source: worldbank
    code: SL.UEM.1524.ZS
    name: Youth unemployment
    unit: "% of labour force aged 15-24"
    direction: down_good
    plain: The share of young people looking for work who cannot find it.
    measures: Modelled ILO estimate of unemployment among 15-24 year olds.
    blindspots: >-
      Students sit outside the labour force, so a country that keeps young people
      in education longer looks better without a single job being created. It also
      misses underemployment, which is the more common problem in poorer countries.
    gamed: >-
      Training schemes and apprenticeships move people out of the count without
      moving them into work.

  - id: female_labour
    category: livelihood
    source: worldbank
    code: SL.TLF.CACT.FE.ZS
    name: Female labour force participation
    unit: "% of women aged 15+"
    direction: up_good
    plain: The share of adult women in paid work or looking for it.
    measures: Modelled ILO estimate of women aged 15+ who are economically active.
    blindspots: >-
      Unpaid household and care work is invisible here, so a fall can mean women
      being pushed out of paid work, or a household becoming prosperous enough not
      to need a second income. The number does not distinguish them.
    gamed: >-
      Whether subsistence agriculture counts as employment is a definitional
      choice, and it moves this sharply in largely rural economies.

  - id: top10_share
    category: livelihood
    source: worldbank
    code: SI.DST.10TH.10
    name: Income share of the richest 10%
    unit: "% of all income"
    direction: down_good
    plain: How much of the country's income goes to the best-off tenth.
    measures: Share of total income or consumption held by the top decile.
    blindspots: >-
      The thinnest series in this catalogue - roughly 2,400 observations across 171
      countries, so most countries have a scattering of years rather than a line.
      Household surveys also systematically miss the very richest, so this
      understates concentration almost everywhere.
    gamed: >-
      Survey design decides the answer: what counts as income, whether capital
      gains are included, and how non-responding rich households are treated.

  - id: military_spend
    category: state
    source: worldbank
    code: MS.MIL.XPND.GD.ZS
    name: Military spending
    unit: "% of GDP"
    direction: neutral
    plain: How much of the economy goes on defence.
    measures: >-
      Military expenditure - personnel, operations, procurement, military aid - as
      a share of output, from SIPRI via the World Bank.
    blindspots: >-
      There is no correct level, so up is neither good nor bad. A share of GDP also
      falls when the economy grows, even if spending rose in cash terms.
    gamed: >-
      Paramilitary forces, veterans' benefits and military pensions sit inside or
      outside the definition depending on the country, and states under pressure
      move them.

  - id: remittances
    category: openness
    source: worldbank
    code: BX.TRF.PWKR.DT.GD.ZS
    name: Remittances received
    unit: "% of GDP"
    direction: neutral
    plain: Money sent home by people working abroad, as a share of the economy.
    measures: Personal transfers and compensation of employees received from abroad.
    blindspots: >-
      Counts only money moving through recorded channels, so where informal
      transfer systems dominate the real figure is far higher. A high number is
      double-edged: it supports households while saying the work is elsewhere.
    gamed: >-
      Not readily gamed by a government, but it jumps when informal flows are
      formalised - which looks like growth and is a change of plumbing.

  - id: current_account
    category: openness
    source: worldbank
    code: BN.CAB.XOKA.GD.ZS
    name: Current account balance
    unit: "% of GDP"
    direction: neutral
    plain: >-
      Whether the country earns more from the rest of the world than it spends
      there. Negative means spending more abroad than it earns.
    measures: Trade, income and transfers with the rest of the world, net, over output.
    blindspots: >-
      A deficit is not automatically a problem - it can fund productive investment -
      and a surplus is not automatically strength, since it can mean weak domestic
      demand. The direction alone tells you nothing.
    gamed: >-
      A large errors-and-omissions line absorbs unrecorded flows, and the balance
      is revised heavily for years after first publication.

  - id: maternal_mortality
    category: human
    source: worldbank
    code: SH.STA.MMRT
    name: Maternal mortality
    unit: deaths per 100,000 live births
    direction: down_good
    plain: How many women die from causes related to pregnancy and childbirth.
    measures: Modelled estimate of maternal deaths per 100,000 live births.
    blindspots: >-
      Modelled, not counted, across most of the world. Where civil registration is
      weak the figure comes from a statistical model whose uncertainty band is wide
      enough to swallow small year-to-year changes.
    gamed: >-
      Cause-of-death coding decides whether a death is maternal, and deaths outside
      hospitals are the ones most often missed.

  - id: water_basic
    category: human
    source: worldbank
    code: SH.H2O.BASW.ZS
    name: Basic drinking water access
    unit: "% of population"
    direction: up_good
    plain: The share of people with a protected water source within a short walk.
    measures: >-
      People using an improved source within a 30-minute round trip, queuing
      included.
    blindspots: >-
      "Basic" is a low bar. It says nothing about whether the water is safe to
      drink, whether it runs today, or whether a household can afford it - a
      country can be at 100% here and still have unsafe water.
    gamed: >-
      Counting infrastructure built rather than infrastructure working: a standpipe
      installed and long since broken still counts as a source.

  - id: co2_pc
    category: human
    source: worldbank
    code: EN.GHG.CO2.PC.CE.AR5
    name: CO2 emissions per person
    unit: tonnes CO2e per person
    direction: down_good
    plain: How much carbon dioxide the average resident's economy emits in a year.
    measures: >-
      Territorial CO2 emissions excluding land use change, per head, on the AR5
      accounting basis.
    blindspots: >-
      Territorial, so emissions from making goods that are exported count where
      they are produced, not where they are consumed. Rich countries that import
      manufactured goods look cleaner than their consumption warrants.
    gamed: >-
      Offshoring heavy industry lowers this while global emissions are unchanged -
      the single largest source of apparent progress in rich countries.

  # ---------------- conflict and defence -------------------------------------
  # UCDP's own API now returns 401 without a key, so the conflict series come
  # through OWID's mirror of UCDP - the same route already used for V-Dem and
  # Maddison. Verified per-country, not regional: 196 ISO3 codes, 1989-2025.

  - id: conflict_deaths
    category: security
    source: owid
    code: deaths-in-armed-conflicts
    column: Best estimate
    name: Deaths in armed conflict
    unit: deaths per year
    direction: down_good
    plain: People killed in organised armed conflict on this country's territory.
    measures: >-
      UCDP best estimate of deaths from state-based, non-state and one-sided
      violence, counted where the fighting happened.
    blindspots: >-
      Counted where the violence occurred, not who caused it - a country hosting
      someone else's war carries the number. It also counts deaths from fighting
      only: famine, displacement and collapsed healthcare kill far more in most
      wars and appear nowhere here.
    gamed: >-
      Not gamed by governments so much as contested by them. UCDP codes from
      reported incidents, so violence in areas closed to journalists is
      systematically undercounted, and the low/high estimates can differ severalfold.

  - id: conflict_count
    category: security
    source: owid
    code: number-of-armed-conflicts
    column: Intrastate
    name: Internal armed conflicts
    unit: conflicts per year
    direction: down_good
    plain: How many separate internal armed conflicts were active in the country.
    measures: >-
      Count of active intrastate conflicts - government against an organised armed
      group - reaching UCDP's threshold of 25 battle deaths in the year.
    blindspots: >-
      A count, so one catastrophic war and one small insurgency both read as "1".
      The 25-death threshold also means low-level violence disappears entirely,
      and a conflict that quietens below it looks resolved when it is dormant.
    gamed: >-
      Classification is the lever: naming an armed opponent a criminal gang
      rather than a political organisation keeps a conflict out of this count.

  - id: terrorism_deaths
    category: security
    source: owid
    code: terrorism-deaths
    column: Fatalities
    name: Deaths from terrorism
    unit: deaths per year
    direction: down_good
    plain: People killed in attacks coded as terrorism.
    measures: Fatalities recorded in the Global Terrorism Database, by country and year.
    blindspots: >-
      "Terrorism" is a contested label, not a neutral measurement. The same act is
      coded differently depending on who did it and who is describing it, and
      state violence is largely outside the definition by construction. Ends 2021.
    gamed: >-
      Definitional. Governments have strong reasons to classify political violence
      as ordinary crime, or ordinary crime as terrorism, and both move this number.

  - id: armed_forces
    category: security
    source: worldbank
    code: MS.MIL.TOTL.P1
    name: Armed forces personnel
    unit: people
    direction: neutral
    plain: How many people serve in the armed forces.
    measures: Active duty military personnel, including paramilitaries where they are trained and equipped for military operations.
    blindspots: >-
      A headcount says nothing about capability - a large conscript army and a
      small professional one are not comparable. Read beside military spending,
      never alone.
    gamed: >-
      Where the line falls between police, paramilitary and military is a national
      choice, and moving a force across it changes the number without changing
      who is under arms.

  - id: arms_imports
    category: security
    source: worldbank
    code: MS.MIL.MPRT.KD
    name: Arms imports
    unit: SIPRI trend-indicator value (1990 US$)
    direction: neutral
    plain: The volume of major weapons brought into the country.
    measures: >-
      SIPRI trend-indicator value of major conventional weapons transferred in -
      a measure of military capability delivered, not of money paid.
    blindspots: >-
      TIV is explicitly NOT a price. It cannot be read as spending, compared with
      a budget, or summed with cash figures. Small arms, ammunition and services
      are excluded, which is most of what is used in most conflicts.
    gamed: >-
      Deliveries are recorded when they arrive, so a single large order lands in
      one year and makes it a spike that says nothing about a trend.

  - id: arms_exports
    category: security
    source: worldbank
    code: MS.MIL.XPRT.KD
    name: Arms exports
    unit: SIPRI trend-indicator value (1990 US$)
    direction: neutral
    plain: The volume of major weapons this country sent to others.
    measures: SIPRI trend-indicator value of major conventional weapons transferred out.
    blindspots: >-
      Same unit caveat as arms imports: a capability index, never a sale value.
      Re-exports and licensed production abroad are attributed in ways that can
      surprise, and the ultimate end user is often not the recorded recipient.
    gamed: >-
      Licensed production overseas moves weapons without moving this number.

  # ---------------- trade ----------------------------------------------------

  - id: exports
    category: openness
    source: worldbank
    code: NE.EXP.GNFS.ZS
    name: Exports
    unit: "% of GDP"
    direction: neutral
    plain: How much of the economy is sold abroad.
    measures: Exports of goods and services as a share of output.
    blindspots: >-
      A share of GDP, so it rises when the domestic economy shrinks. It also says
      nothing about WHAT is exported - one commodity or a diversified base look
      identical here, and they are not the same position at all.
    gamed: >-
      Re-exports and goods that merely pass through inflate this for entrepot
      economies, which is why some small states exceed 100%.

  - id: imports
    category: openness
    source: worldbank
    code: NE.IMP.GNFS.ZS
    name: Imports
    unit: "% of GDP"
    direction: neutral
    plain: How much of what the country uses comes from abroad.
    measures: Imports of goods and services as a share of output.
    blindspots: >-
      High imports are not weakness and low imports are not strength - both can
      reflect wealth or crisis. Read against exports, not alone.
    gamed: >-
      Under-invoicing to avoid duty, and smuggling, both suppress this in places
      where enforcement is weak.

  - id: hightech_exports
    category: openness
    source: worldbank
    code: TX.VAL.TECH.MF.ZS
    name: High-technology exports
    unit: "% of manufactured exports"
    direction: up_good
    plain: How much of what the country sells abroad is advanced manufacturing.
    measures: >-
      Exports of aerospace, computers, pharmaceuticals, scientific instruments and
      electrical machinery, as a share of manufactured exports.
    blindspots: >-
      Classified by PRODUCT, not by what the country actually did. Assembling
      imported components counts in full, so a country doing final assembly can
      outrank one that designed the chip inside.
    gamed: >-
      Not usually gamed, but it is routinely quoted as evidence of an innovation
      economy when it may only show a phone assembly plant.

  # ---------------- state finances -------------------------------------------

  - id: govt_revenue
    category: state
    source: worldbank
    code: GC.REV.XGRT.GD.ZS
    name: Government revenue
    unit: "% of GDP"
    direction: neutral
    plain: Everything the government takes in, except foreign aid.
    measures: Revenue excluding grants - taxes, social contributions, fines, property income.
    blindspots: >-
      Central government only in most countries, so states, provinces and
      municipalities are missing - which understates the true size of the state
      in federal countries, India and the US among them.
    gamed: >-
      One-off asset sales and central bank transfers can be booked as revenue,
      flattering a single year.

  - id: fiscal_balance
    category: state
    source: worldbank
    code: GC.NLD.TOTL.GD.ZS
    name: Fiscal balance
    unit: "% of GDP"
    direction: neutral
    plain: >-
      Whether the government took in more than it spent. Negative is a deficit.
    measures: Net lending (+) or net borrowing (-) as a share of output.
    blindspots: >-
      A deficit is not automatically mismanagement - borrowing to build something
      that lasts is different from borrowing to pay salaries, and this number
      cannot tell them apart. Nor is a surplus automatically good.
    gamed: >-
      Off-budget vehicles, state enterprise borrowing and arrears to suppliers all
      move spending outside the measured balance while the obligation remains.

  - id: public_wage_bill
    category: state
    source: worldbank
    code: GC.XPN.COMP.ZS
    name: Public wage bill
    unit: "% of government expense"
    direction: neutral
    plain: How much of government spending goes on paying its own staff.
    measures: Compensation of employees as a share of total government expense.
    blindspots: >-
      High is not automatically waste: teachers and nurses are public employees.
      A low share can mean an efficient state or a hollowed-out one that has
      stopped delivering services directly.
    gamed: >-
      Outsourcing the same work to contractors moves it out of compensation and
      into goods and services, with no change in what is done or spent.

  - id: govt_health_spend
    category: state
    source: worldbank
    code: SH.XPD.GHED.GD.ZS
    name: Government health spending
    unit: "% of GDP"
    direction: up_good
    plain: How much the government itself spends on health.
    measures: >-
      Domestic general government health expenditure as a share of output -
      public money only, excluding what households pay themselves.
    blindspots: >-
      Spending is not care. It says nothing about whether it reaches patients, and
      the gap between this and total health spending is what households pay out of
      pocket - often the more revealing number of the two.
    gamed: >-
      Reclassifying water, sanitation or nutrition programmes as health spending
      raises this without a single extra clinic.

  # ---------------- health and mortality -------------------------------------

  - id: under5_mortality
    category: human
    source: worldbank
    code: SH.DYN.MORT
    name: Under-five mortality
    unit: deaths per 1,000 live births
    direction: down_good
    plain: How many children die before their fifth birthday.
    measures: Probability of dying between birth and age five, per 1,000 live births.
    blindspots: >-
      Among the hardest numbers to fake and the slowest to move, which is what
      makes it useful - but it is modelled where registration is weak, and a
      national figure hides differences between regions and classes that are often
      larger than differences between countries.
    gamed: >-
      Under-registration of births and of infant deaths lowers it, and the two do
      not cancel out.

  - id: death_rate
    category: human
    source: worldbank
    code: SP.DYN.CDRT.IN
    name: Crude death rate
    unit: deaths per 1,000 people
    direction: neutral
    plain: How many people die each year per thousand of the population.
    measures: Total deaths per 1,000 mid-year population.
    blindspots: >-
      CRUDE is the operative word: it is not age-adjusted, so a rich country with
      many old people has a higher rate than a poor country with a young
      population. It measures age structure at least as much as health, and
      comparing two countries on it directly is usually a mistake.
    gamed: >-
      Not gamed so much as misused - it is frequently quoted as though it were a
      health outcome.

  - id: tb_incidence
    category: human
    source: worldbank
    code: SH.TBS.INCD
    name: Tuberculosis incidence
    unit: new cases per 100,000 people
    direction: down_good
    plain: How many people newly fall ill with tuberculosis each year.
    measures: Estimated new and relapse TB cases per 100,000 population.
    blindspots: >-
      Estimated, not counted. A country that improves its detection can appear to
      get sicker while actually getting better at finding cases - a rise here may
      be a working health system rather than a failing one.
    gamed: >-
      Reported case notifications depend on how hard a country looks, so reduced
      screening lowers the notified count while the disease is unchanged.

  - id: suicide_rate
    category: human
    source: worldbank
    code: SH.STA.SUIC.P5
    name: Suicide rate
    unit: deaths per 100,000 people
    direction: down_good
    plain: How many people take their own lives each year, per hundred thousand.
    measures: Age-standardised suicide mortality rate.
    blindspots: >-
      Systematically undercounted where suicide is criminalised or carries
      religious stigma, which makes cross-country comparison unreliable in exactly
      the places the number would matter most. Deaths of undetermined intent are
      handled differently by different registries.
    gamed: >-
      Coroner and certification practice decides the number as much as the
      underlying rate does.
